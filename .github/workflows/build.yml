name: Build crDroid GSI with Unisoc Fix

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Set Up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git gnupg flex bison build-essential zip \
            curl zlib1g-dev libc6-dev-i386 libncurses-dev libncurses6 \
            libx11-dev libgl1-mesa-dev libxml2-utils xsltproc \
            unzip fontconfig python3 ccache libssl-dev

          # If any older AOSP host binaries specifically look for libncurses.so.5:
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize crDroid & TrebleDroid Manifest
        run: |
          git config --global user.name "Builder"
          git config --global user.email "builder@example.com"
          mkdir crdroid_tree && cd crdroid_tree

          # Initialize crDroid manifest with shallow clone to save disk space
          repo init -u https://github.com/crdroidandroid/android.git -b 13.0 --depth=1

          # Add TrebleDroid local manifest (for GSI hardware compatibility)
          git clone https://github.com/TrebleDroid/treble_manifest.git .repo/local_manifests -b android-13.0

          # FIX: Strip out conflicting duplicate 'github' remote and remove AOSP-only replace.xml
          sed -i '/<remote.*name="github"/d' .repo/local_manifests/*.xml
          rm -f .repo/local_manifests/replace.xml

          # Sync the source tree
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j4

      - name: Apply Custom Unisoc Patch
        run: |
          python3 - << 'EOF'
          import sys
          import re

          sf_path = "crdroid_tree/frameworks/native/services/surfaceflinger/SurfaceFlinger.cpp"

          with open(sf_path, "r") as f:
              content = f.read()

          # 1. Ensure properties header is included
          header = "#include <cutils/properties.h>\n"
          if header not in content:
              content = header + content

          # 2. Target the Android 13 CompositionEngine color matrix line
          pattern = r"refreshArgs\.colorTransformMatrix\s*=\s*mDrawingState\.colorMatrix;"

          replacement = """char prop[PROPERTY_VALUE_MAX];
                  property_get("persist.sys.phh.disable_color_transform", prop, "0");
                  if (strcmp(prop, "1") == 0 || strcmp(prop, "true") == 0) {
                      refreshArgs.colorTransformMatrix = mat4();
                  } else {
                      refreshArgs.colorTransformMatrix = mDrawingState.colorMatrix;
                  }"""

          if re.search(pattern, content):
              content = re.sub(pattern, replacement, content, count=1)
              with open(sf_path, "w") as f:
                  f.write(content)
              print("SUCCESS: Injected Unisoc color transform workaround into Android 13 SurfaceFlinger!")
          else:
              print("ERROR: Could not locate refreshArgs.colorTransformMatrix in SurfaceFlinger.cpp", file=sys.stderr)
              sys.exit(1)
          EOF

      - name: Build crDroid GSI
        run: |
          cd crdroid_tree

          # 1. Generate the Treble target makefiles (treble_arm64_bvN, etc.)
          cd device/phh/treble
          if [ -f "crDroid.mk" ] || [ -f "crdroid.mk" ]; then
              bash generate.sh $(ls crdroid.mk crDroid.mk 2>/dev/null | head -n 1 | sed 's/\.mk//')
          elif [ -f "lineage.mk" ]; then
              bash generate.sh lineage
          else
              bash generate.sh
          fi
          cd ../../..

          # 2. Prevent Out-Of-Memory (OOM) crashes during Java / Metalava compilation
          export _JAVA_OPTIONS="-Xmx4g"

          # 3. Source environment and select GSI target
          source build/envsetup.sh
          lunch treble_arm64_bvN-userdebug

          # 4. Compile the system image
          make systemimage -j$(nproc --all)

      - name: Compress and Prepare Output
        run: |
          cd crdroid_tree/out/target/product/phhgsi_arm64_ab
          xz -z -k -T0 system.img
          echo "OUTPUT_DIR=$PWD" >> $GITHUB_ENV

      - name: Upload Finished GSI
        uses: actions/upload-artifact@v4
        with:
          name: crDroid-UnisocFixed-GSI
          path: ${{ env.OUTPUT_DIR }}/system.img.xz
